<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" role="img" aria-label="PRISM">
  <!-- Same geometry as .logo-mark in Brand: three 10×16 frames, origin at center -->
  <g transform="translate(16 16) scale(1.25)">
    <g transform="skewY(30) rotate(30)">
      <rect x="-5" y="-8" width="10" height="16" stroke="#79f2b0" stroke-width="1" />
    </g>
    <g transform="skewY(-30) rotate(-30)" opacity="0.65">
      <rect x="-5" y="-8" width="10" height="16" stroke="#79f2b0" stroke-width="1" />
    </g>
    <g transform="rotate(90)" opacity="0.35">
      <rect x="-5" y="-8" width="10" height="16" stroke="#79f2b0" stroke-width="1" />
    </g>
  </g>
</svg>
